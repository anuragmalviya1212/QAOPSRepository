name: Playwright Tests

on:
  push:
    branches: [Main, develop, staging]
  pull_request:
    branches: [Main, develop, staging]

env:
  NODE_VERSION: '24'

jobs:
  # Determine which tests to run based on branch
  determine-tests:
    runs-on: ubuntu-latest
    outputs:
      smoke: ${{ steps.set-tests.outputs.smoke }}
      regression: ${{ steps.set-tests.outputs.regression }}
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Set test types based on branch
        id: set-tests
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/Main" ]]; then
            echo "smoke=true" >> $GITHUB_OUTPUT
            echo "regression=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "smoke=true" >> $GITHUB_OUTPUT
            echo "regression=true" >> $GITHUB_OUTPUT
          else
            echo "smoke=true" >> $GITHUB_OUTPUT
            echo "regression=false" >> $GITHUB_OUTPUT
          fi

      - name: Set environment based on branch
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/Main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
          fi

  # Smoke Tests
  smoke-tests:
    needs: determine-tests
    if: ${{ needs.determine-tests.outputs.smoke == 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.determine-tests.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      
      - name: Run Smoke Tests
        run: npx playwright test --grep @smoke || npx playwright test
        env:
          ENVIRONMENT: ${{ needs.determine-tests.outputs.environment }}
      
      - name: Generate Allure Report (Smoke)
        if: ${{ !cancelled() && hashFiles('allure-results') != '' }}
        run: npx allure generate allure-results -o allure-report-smoke --clean
      
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: smoke-tests-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore
      
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('allure-report-smoke') != '' }}
        with:
          name: smoke-allure-report
          path: allure-report-smoke/
          retention-days: 30
          if-no-files-found: ignore

  # Regression Tests
  regression-tests:
    needs: determine-tests
    if: ${{ needs.determine-tests.outputs.regression == 'true' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.determine-tests.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      
      - name: Run Regression Tests
        run: npx playwright test --grep @regression || npx playwright test
        env:
          ENVIRONMENT: ${{ needs.determine-tests.outputs.environment }}
      
      - name: Generate Allure Report (Regression)
        if: ${{ !cancelled() && hashFiles('allure-results') != '' }}
        run: npx allure generate allure-results -o allure-report-regression --clean
      
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: regression-tests-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore
      
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('allure-report-regression') != '' }}
        with:
          name: regression-allure-report
          path: allure-report-regression/
          retention-days: 30
          if-no-files-found: ignore

  # Summary Job
  test-summary:
    if: ${{ always() }}
    needs: [determine-tests, smoke-tests, regression-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Test Results Summary
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.determine-tests.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Smoke Tests:** ${{ needs.determine-tests.outputs.smoke == 'true' && '✅ Executed' || '⏭️ Skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Regression Tests:** ${{ needs.determine-tests.outputs.regression == 'true' && '✅ Executed' || '⏭️ Skipped' }}" >> $GITHUB_STEP_SUMMARY

  # Email Report
  send-email-report:
    if: ${{ always() }}
    needs: [test-summary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Create Email Report
        id: email_body
        run: |
          EMAIL_BODY=$(cat <<EOF
          <html>
            <body style="font-family: Arial, sans-serif;">
              <h2>🧪 Playwright Test Report</h2>
              <hr>
              <p><strong>Repository:</strong> ${{ github.repository }}</p>
              <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
              <p><strong>Commit:</strong> ${{ github.sha }}</p>
              <p><strong>Triggered by:</strong> ${{ github.actor }}</p>
              <p><strong>Run ID:</strong> <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">${{ github.run_id }}</a></p>
              <hr>
              <h3>📊 Test Summary</h3>
              <ul>
                <li><strong>Smoke Tests:</strong> ✅ Executed</li>
                <li><strong>Regression Tests:</strong> ✅ Executed</li>
              </ul>
              <hr>
              <h3>📎 Attached Reports</h3>
              <ul>
                <li>Smoke Tests Report (playwright-report)</li>
                <li>Smoke Tests Allure Report</li>
                <li>Regression Tests Report (playwright-report)</li>
                <li>Regression Tests Allure Report</li>
              </ul>
              <hr>
              <p style="color: #666; font-size: 12px;">
                Generated at ${{ github.event.head_commit.timestamp }}<br>
                View full details: <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">GitHub Actions Run</a>
              </p>
            </body>
          </html>
          EOF
          )
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$EMAIL_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Email Report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "🧪 Test Report - ${{ github.ref_name }} - ${{ github.run_number }}"
          to: anuragmalviya90@gmail.com
          from: ${{ secrets.SMTP_FROM_EMAIL }}
          html_body: ${{ steps.email_body.outputs.body }}
          attachments: reports/**/*.html
          ignore_cert: false
        continue-on-error: true